<!doctype html>
<!-- 主视频的封面。素材是 tools/film.py 放进 assets/ 的：App 真出的三张卡片和图标。
     横版 1920 × 1080（默认），竖版 3:4 在地址后面加 #tall（1242 × 1656）。出图见 REVIEW.md。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Vibepost 封面</title>
<style>
@font-face { font-family: "PF"; src: local("PingFangSC-Regular"), local("PingFang SC"); font-weight: 400; }
@font-face { font-family: "PF"; src: local("PingFangSC-Medium"); font-weight: 500; }
@font-face { font-family: "PF"; src: local("PingFangSC-Semibold"); font-weight: 700; }
:root { --ground: #f2f2f4; --ink: #16171a; --muted: #5d6068; --accent: #ff4f1f; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--ground); overflow: hidden; }
#cover { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); font-family: "PF", sans-serif; color: var(--ink); }
.brand { position: absolute; left: 120px; top: 110px; display: flex; align-items: center; gap: 26px; font: 700 64px/1 "PF", sans-serif; letter-spacing: -.01em; }
.brand img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .35); }
h1 { position: absolute; left: 114px; top: 360px; font: 700 168px/1.16 "PF", sans-serif; letter-spacing: -.02em; white-space: nowrap; }
h1 span { box-shadow: inset 0 -.12em 0 var(--accent); }
.sub { position: absolute; left: 122px; top: 800px; font: 500 50px/1.4 "PF", sans-serif; color: var(--muted); white-space: nowrap; }
.pages { position: absolute; left: 1044px; top: 0; width: 876px; height: 1080px; }
.pages img { position: absolute; display: block; border-radius: 16px; box-shadow: 0 30px 70px rgba(0, 0, 0, .24), 0 0 0 1px rgba(0, 0, 0, .06); }
.c1 { left: 0; top: 310px; width: 360px; transform: rotate(-5deg); }
.c3 { left: 500px; top: 310px; width: 360px; transform: rotate(5deg); }
.c2 { left: 250px; top: 262px; width: 360px; }

/* 竖版 3:4：字在上，卡片在下 */
#cover.tall { width: 1242px; height: 1656px; }
.tall .brand { left: 90px; top: 96px; }
.tall h1 { left: 84px; top: 276px; font-size: 172px; }
.tall .sub { left: 92px; top: 706px; font-size: 48px; }
.tall .pages { left: 30px; top: 850px; width: 1182px; height: 800px; }
.tall .c1 { left: 0; top: 70px; width: 500px; }
.tall .c3 { left: 682px; top: 70px; width: 500px; }
.tall .c2 { left: 341px; top: 0; width: 500px; }
</style>
</head>
<body>
<div id="cover">
  <div class="brand"><img src="assets/icon.png" alt="">Vibepost</div>
  <h1>你写字，<br><span>Agent</span> 排版。</h1>
  <p class="sub">分页、配图、套样式，你点头才算数。</p>
  <div class="pages">
    <img class="c1" src="assets/card-1.jpg" alt="">
    <img class="c3" src="assets/card-3.jpg" alt="">
    <img class="c2" src="assets/card-2.jpg" alt="">
  </div>
</div>
<script>if (location.hash === "#tall") document.getElementById("cover").classList.add("tall");</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="232" height="72" viewBox="0 0 232 72" role="img" aria-labelledby="title">
  <title id="title">Vibepost</title>
  <!-- 标志：App 图标（brand/icon.png）的简化版，橘红圆角方块上三道波纹；字标 post 同色 -->
  <style>
    .tile { fill: #fc4d1f; }
    .wave { fill: none; stroke: #ffffff; stroke-width: 3.2; stroke-linecap: round; }
    .word { fill: #161616; font: 600 34px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.5px; }
    .post { fill: #fc4d1f; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #f4f4f4; }
      .post { fill: #ff7a52; }
    }
  </style>
  <rect class="tile" x="8" y="12" width="48" height="48" rx="11" />
  <path class="wave" d="M18 25c4-3.5 8-3.5 12 0s8 3.5 12 0 4-2 4-2" />
  <path class="wave" d="M18 36c4-3.5 8-3.5 12 0s8 3.5 12 0 4-2 4-2" />
  <path class="wave" d="M18 47c4-3.5 8-3.5 12 0s8 3.5 12 0 4-2 4-2" />
  <text class="word" x="68" y="47">Vibe<tspan class="post">post</tspan></text>
</svg>
